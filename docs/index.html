<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>三角洲行动 · 改枪码库</title>
<meta name="description" content="三角洲行动改枪码检索库：按枪械浏览，烽火地带 / 全面战场 / 黑潮爆破，支持搜索、价格筛选、收藏与对比。" />
<style>
  :root{
    --bg:#0b0f14; --bg2:#111823; --card:#151d29; --card-hi:#1b2635;
    --line:#243244; --line-hi:#33475f;
    --txt:#e8eef6; --dim:#8fa3bb; --dim2:#61748c;
    --accent:#ff8a2b; --accent2:#ffb765; --ok:#3ddc97; --star:#ffc857; --bad:#ff6b6b;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #16233a 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 0%, #2a1a0d 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }
  a{color:var(--accent2)}
  button{font-family:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:0 18px 120px}

  header.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);
    background:rgba(11,15,20,.85);border-bottom:1px solid var(--line)}
  .top-in{max-width:1240px;margin:0 auto;padding:14px 18px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer}
  .mark{width:38px;height:38px;flex:0 0 38px;border-radius:10px;
    background:linear-gradient(145deg,var(--accent),#d85f10);display:grid;place-items:center;
    font-weight:800;font-size:19px;color:#20130a;box-shadow:0 6px 20px rgba(255,138,43,.28)}
  .brand h1{margin:0;font-size:17px;letter-spacing:.3px;white-space:nowrap}
  .brand .sub{font-size:12px;color:var(--dim2);margin-top:1px}
  .stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12.5px;color:var(--dim);white-space:nowrap}
  .stat b{color:var(--txt);font-size:14px;font-family:var(--mono)}

  .notice{margin:16px 0 0;border:1px solid var(--line);border-left:3px solid var(--accent);
    background:linear-gradient(90deg,rgba(255,138,43,.07),transparent 60%);
    border-radius:0 10px 10px 0;padding:10px 14px;font-size:13px;color:var(--dim)}
  .notice summary{cursor:pointer;color:var(--accent2);font-weight:600;list-style:none}
  .notice summary::-webkit-details-marker{display:none}
  .notice summary::before{content:"⚠ "}
  .notice ul{margin:9px 0 2px;padding-left:18px}
  .notice li{margin:4px 0}

  .panel{margin:18px 0 10px;background:rgba(17,24,35,.6);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row + .row{margin-top:10px}
  .search{position:relative;flex:1 1 260px;min-width:200px}
  .search input{width:100%;padding:11px 14px 11px 38px;border-radius:10px;background:var(--card);
    border:1px solid var(--line);color:var(--txt);font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,43,.13)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  select{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    color:var(--txt);font-size:13.5px;outline:none;cursor:pointer}
  select:focus{border-color:var(--accent)}
  .btn{padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    color:var(--dim);font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--line-hi);color:var(--txt)}
  .btn.on{background:linear-gradient(145deg,var(--accent),#e0700f);border-color:transparent;color:#1c1108;font-weight:700}
  .btn.ghost{background:transparent}

  .price-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
  .price-box input[type=range]{width:130px;accent-color:var(--accent);cursor:pointer}
  .price-val{font-family:var(--mono);color:var(--accent2);min-width:88px;text-align:center}
  .chk{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px;color:var(--dim)}
  .chk input{accent-color:var(--accent);cursor:pointer}

  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 10px}
  .tab{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
    color:var(--dim);font-size:13.5px;cursor:pointer;transition:.15s;user-select:none}
  .tab:hover{border-color:var(--line-hi);color:var(--txt)}
  .tab.on{background:linear-gradient(145deg,var(--accent),#e0700f);border-color:transparent;color:#1c1108;font-weight:700}
  .tab .n{opacity:.65;font-size:12px;margin-left:5px;font-family:var(--mono)}

  /* category pills */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
  .pill{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);
    color:var(--dim);font-size:13px;cursor:pointer;transition:.15s;user-select:none}
  .pill:hover{border-color:var(--line-hi);color:var(--txt)}
  .pill.on{background:#23324b;border-color:var(--line-hi);color:var(--txt);font-weight:600}
  .pill .n{opacity:.6;font-size:11.5px;margin-left:5px;font-family:var(--mono)}

  /* category sections */
  .cat-section{margin-bottom:24px}
  .cat-section:last-child{margin-bottom:0}
  .cat-title{display:flex;align-items:center;gap:9px;margin:0 0 11px;font-size:15px;font-weight:700;color:var(--txt)}
  .cat-title::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--accent)}
  .cat-title .cnt{font-size:12px;color:var(--dim2);font-family:var(--mono);font-weight:400}

  /* ---------- level 1: gun cards ---------- */
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
  .gun-card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:13px;padding:14px 15px;display:flex;flex-direction:column;gap:9px;
    transition:.15s;position:relative;overflow:hidden;cursor:pointer}
  .gun-card::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:0;transition:.15s}
  .gun-card:hover{border-color:var(--line-hi);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.34)}
  .gun-card:hover::after{opacity:1}
  .gun-card.fav{border-color:rgba(255,200,87,.35)}
  .gun-card.fav::after{background:var(--star);opacity:1}
  .gc-head{display:flex;align-items:center;gap:8px}
  .gc-name{font-weight:700;font-size:17px;letter-spacing:.2px}
  .gc-head .spacer{flex:1}
  .gc-badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:11px;padding:3px 8px;border-radius:6px;background:#1d2836;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.price{color:var(--ok);border-color:rgba(61,220,151,.28);background:rgba(61,220,151,.08)}
  .badge.mode{color:#9dc4ff;border-color:rgba(157,196,255,.24);background:rgba(157,196,255,.07)}
  .gc-preview{font-size:12.5px;color:var(--dim2);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .gc-go{font-size:12.5px;color:var(--accent2);font-weight:600;margin-top:auto}
  /* 枪械图：裁切自带蓝灰渐变底，用柔和遮罩让边缘融进卡片 */
  .gc-img{height:66px;display:flex;align-items:center;justify-content:center;margin:-2px 0 2px}
  .gc-img img{max-height:66px;max-width:100%;object-fit:contain;
    -webkit-mask-image:radial-gradient(ellipse 68% 78% at 50% 50%, #000 38%, rgba(0,0,0,.55) 70%, transparent 99%);
    mask-image:radial-gradient(ellipse 68% 78% at 50% 50%, #000 38%, rgba(0,0,0,.55) 70%, transparent 99%)}
  .dh-img{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:130px}
  .dh-img img{max-height:60px;max-width:200px;object-fit:contain;
    -webkit-mask-image:radial-gradient(ellipse 74% 84% at 50% 50%, #000 42%, rgba(0,0,0,.55) 74%, transparent 99%);
    mask-image:radial-gradient(ellipse 74% 84% at 50% 50%, #000 42%, rgba(0,0,0,.55) 74%, transparent 99%)}

  /* ---------- level 2: gun detail ---------- */
  .detail-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;
    background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:13.5px;cursor:pointer;transition:.15s}
  .back:hover{border-color:var(--line-hi);color:var(--txt)}
  .detail-head .title{font-size:21px;font-weight:800;letter-spacing:.3px}
  .detail-head .meta{font-size:12.5px;color:var(--dim2);margin-top:2px}
  .detail-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  .builds{display:flex;flex-direction:column;gap:8px}
  .build-item{display:flex;align-items:center;gap:12px;
    background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;transition:.15s}
  .build-item:hover{border-color:var(--line-hi)}
  .build-item.fav{border-color:rgba(255,200,87,.35)}
  .bi-left{flex:0 0 190px;min-width:0}
  .bi-build{font-size:14.5px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bi-sub{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .bi-code{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;letter-spacing:.4px;color:#cfe3ff;
    background:#0d131c;border:1px solid var(--line);border-radius:8px;padding:8px 11px;
    overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .bi-code::-webkit-scrollbar{display:none}
  .bi-acts{flex:0 0 auto;display:flex;gap:6px;align-items:center}
  .icon-btn{width:30px;height:30px;border-radius:8px;background:#182231;border:1px solid var(--line);
    color:var(--dim2);cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1;transition:.15s;padding:0}
  .icon-btn:hover{color:var(--txt);border-color:var(--line-hi)}
  .icon-btn.star.on{color:var(--star);border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.09)}
  .icon-btn.cmp.on{color:var(--accent);border-color:rgba(255,138,43,.5);background:rgba(255,138,43,.1)}
  .icon-btn.flag:hover{color:var(--bad);border-color:rgba(255,107,107,.5)}
  .icon-btn.flag.on{color:var(--ok);border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.09)}

  /* 已失效 / 用户新增 */
  .build-item.invalid{opacity:.55;border-style:dashed}
  .build-item.invalid .bi-code{text-decoration:line-through;text-decoration-color:var(--bad)}
  .badge.author{color:var(--star);border-color:rgba(255,200,87,.3);background:rgba(255,200,87,.08)}
  .badge.gone{color:var(--bad);border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.08)}
  .badge.mine{color:#c9a4ff;border-color:rgba(201,164,255,.3);background:rgba(201,164,255,.08)}

  /* 新增表单 */
  .form-grid{display:flex;flex-direction:column;gap:12px;margin-top:4px}
  .form-grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim)}
  .form-grid label b{color:var(--accent2);font-weight:600}
  .form-grid input,.form-grid select{padding:10px 12px;border-radius:9px;background:#0d131c;
    border:1px solid var(--line);color:var(--txt);font-size:14px;outline:none;font-family:inherit}
  .form-grid input:focus,.form-grid select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,43,.13)}
  .form-grid .hint{font-size:11.5px;color:var(--dim2)}
  .form-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:6px}
  .form-actions .btn{padding:10px 18px}
  .btn.primary{background:linear-gradient(145deg,var(--accent),#e0700f);border-color:transparent;color:#1c1108;font-weight:700}
  .form-err{color:var(--bad);font-size:13px;min-height:18px}
  .copy{flex:0 0 auto;border:1px solid var(--line-hi);background:#182231;color:var(--txt);
    border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
  .copy:hover{background:var(--accent);border-color:transparent;color:#1c1108;font-weight:700}
  .copy.done{background:var(--ok);border-color:transparent;color:#062015;font-weight:700}

  .empty{text-align:center;padding:70px 20px;color:var(--dim2)}
  .empty b{display:block;font-size:16px;color:var(--dim);margin-bottom:6px}

  .cmpbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;
    background:rgba(21,29,41,.96);border:1px solid var(--line-hi);border-radius:14px;
    padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:calc(100vw - 28px)}
  .cmpbar .chip{font-size:12px;padding:5px 9px;border-radius:8px;background:#0d131c;border:1px solid var(--line);
    color:var(--dim);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmpbar .chip b{color:var(--txt)}

  .modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.78);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-in{background:var(--bg2);border:1px solid var(--line-hi);border-radius:16px;max-width:1000px;
    width:100%;max-height:86vh;overflow:auto;padding:18px 20px 22px}
  .modal h2{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:10px}
  .modal h2 .x{margin-left:auto}
  table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
  table.cmp th,table.cmp td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
  table.cmp th{background:#0f1620;color:var(--dim);font-weight:600;white-space:nowrap;width:88px}
  table.cmp td{font-family:var(--mono);font-size:12.5px;word-break:break-all}
  table.cmp td.txt{font-family:inherit;font-size:13.5px}
  .best{color:var(--ok);font-weight:700}

  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim2);line-height:1.9}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--ok);color:#062015;
    font-weight:700;padding:10px 20px;border-radius:10px;transition:.25s;opacity:0;pointer-events:none;z-index:80;font-size:14px}
  .toast.on{transform:translate(-50%,0);opacity:1}
  @media (max-width:620px){
    .brand h1{font-size:15px} .stats{width:100%;margin-left:0}
    .detail-head .acts{margin-left:0;width:100%}
    .build-item{flex-wrap:wrap;gap:9px}
    .bi-left{flex:1 1 100%}
    .bi-code{flex:1 1 100%;order:3}
    .bi-acts{order:2;margin-left:auto}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand" id="brand">
      <div class="mark">Δ</div>
      <div>
        <h1>三角洲行动 · 改枪码库</h1>
        <div class="sub" id="sub">加载中…</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">枪械 <b id="s-guns">0</b></div>
      <div class="stat">改枪码 <b id="s-codes">0</b></div>
      <div class="stat">收录 <b id="s-total">0</b></div>
    </div>
  </div>
</header>

<div class="wrap">
  <details class="notice" id="notice" hidden>
    <summary>使用须知</summary>
    <ul id="notice-list"></ul>
  </details>

  <div class="tabs" id="tabs"></div>
  <div class="chips" id="cats"></div>

  <div class="panel">
    <div class="row">
      <div class="price-box">
        <span>价格</span>
        <input type="range" id="pmin" />
        <span class="price-val" id="pval">—</span>
        <input type="range" id="pmax" />
      </div>
      <label class="chk"><input type="checkbox" id="noPrice" checked /> 包含未标价</label>
      <label class="chk"><input type="checkbox" id="favOnly" /> 只看收藏</label>
      <label class="chk" id="invWrap"><input type="checkbox" id="showInv" /> 显示已失效</label>
      <select id="sort">
        <option value="gun">按枪械名排序</option>
        <option value="price">按最低价从低到高</option>
        <option value="pricedesc">按最高价从高到低</option>
        <option value="count">按方案数量排序</option>
      </select>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn primary" id="addBtn" hidden>+ 新增改枪码</button>
        <button class="btn ghost" id="share">复制当前链接</button>
        <button class="btn ghost" id="reset">清空筛选</button>
      </div>
    </div>
  </div>

  <!-- level 1 -->
  <div id="guns"></div>
  <!-- level 2 -->
  <div id="detail" hidden></div>

  <div id="empty" class="empty" hidden><b>没有匹配的改枪码</b>换个关键词，或点「清空筛选」</div>

  <footer>
    <div id="foot-stats"></div>
    <div id="foot-note"></div>
    <div id="foot-copy"></div>
  </footer>
</div>

<div class="cmpbar" id="cmpbar" hidden>
  <span style="font-size:13px;color:var(--dim)">对比</span>
  <span id="cmpchips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <button class="btn on" id="cmpOpen" style="padding:7px 12px">开始对比</button>
  <button class="btn ghost" id="cmpClear" style="padding:7px 12px">清空</button>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast">已复制</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.DELTA_DATA || { records: [], modes: [], notices: [], total: 0,
    priceMin: 0, priceMax: 0 };
  var BASE = D.records || [];   // 仓库里烘焙好的基础数据（只读）
  var CHANGES = [];             // 从 Worker 拉回来的改动：新增 + 失效标记
  var ALL = [];                 // 合并后的最终列表
  var byId = {};
  var API = String(D.apiBase || "").replace(/\/+$/, "");
  var apiOnline = false;
  var FAV_KEY = "delta-codes-favs-v1";
  var G_MIN = D.priceMin || 0, G_MAX = D.priceMax || 0;
  var PRICE_RE = /(\d+(?:\.\d+)?)\s*[wW万]/;

  // ---------- gun categories ----------
  // 注意顺序：先匹配更具体的名字，否则会被泛化分类抢走。
  // 枪名里是「…狙击步枪」，所以必须匹配「狙击步枪」而不是「狙击枪」。
  var CATS = [
    ["步枪", ["突击步枪", "战斗步枪"]],
    ["冲锋枪", ["冲锋枪"]],
    ["机枪", ["机枪"]],
    ["射手步枪", ["射手步枪", "精确射手"]],
    ["狙击步枪", ["狙击步枪", "狙击枪"]],
    ["霰弹枪", ["霰弹枪"]],
    ["手枪", ["手枪", "G17", "G18", "QSZ92G", "93R", "沙漠之鹰", "M1911", "左轮"]],
  ];
  function catOf(gun) {
    for (var i = 0; i < CATS.length; i++)
      for (var j = 0; j < CATS[i][1].length; j++)
        if (gun.indexOf(CATS[i][1][j]) >= 0) return CATS[i][0];
    return "其他";
  }
  function priceOf(text) {
    var m = PRICE_RE.exec(text || "");
    return m ? parseFloat(m[1]) : null;
  }

  // ---------- 枪械图 ----------
  var GUN_IMG = D.gunImages || {};
  function gunImgSrc(gun) {
    var f = GUN_IMG[gun];
    if (!f) return "";
    var inline = (window.DELTA_INLINE_IMAGES || {})[f];
    return inline || ("img/guns/" + f);
  }
  function gunImgTag(gun, cls) {
    var src = gunImgSrc(gun);
    if (!src) return "";
    return '<div class="' + cls + '"><img loading="lazy" decoding="async" src="' + esc(src) +
      '" alt="' + esc(gun) + '"></div>';
  }

  /** 基础数据 + 改动 = 最终列表 */
  function rebuildAll() {
    var flag = {};
    CHANGES.forEach(function (c) { if (c.type === "flag" && c.target_id) flag[c.target_id] = c.status; });

    var out = BASE.map(function (r) {
      var c = {};
      for (var k in r) c[k] = r[k];
      c.invalid = flag[r.id] === "invalid";
      c.author = "";
      c.userAdded = false;
      return c;
    });
    CHANGES.forEach(function (c) {
      if (c.type !== "add") return;
      var id = "user|" + c.id;
      out.push({
        id: id, code: c.code, gun: c.gun, build: c.build || "",
        mode: c.mode || c.tab, tab: c.tab, price: priceOf(c.build),
        author: c.author || "", userAdded: true,
        invalid: flag[id] === "invalid"
      });
    });
    out.forEach(function (r) { r.cat = catOf(r.gun); });
    ALL = out;
    byId = {};
    ALL.forEach(function (r) { byId[r.id] = r; });
  }

  // ---------- 后端 ----------
  function apiGetChanges() {
    if (!API) { apiOnline = false; return Promise.resolve(false); }
    return fetch(API + "/api/changes", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        CHANGES = (d && d.changes) || [];
        apiOnline = true;
        rebuildAll();
        return true;
      })
      .catch(function () { apiOnline = false; rebuildAll(); return false; });
  }
  function apiPost(path, body) {
    return fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error((d && d.error) || ("HTTP " + r.status));
        return d;
      });
    });
  }

  // ---------- state ----------
  function defaults() {
    return {
      tab: "", cat: "", sort: "gun",
      min: G_MIN, max: G_MAX, noPrice: true, favOnly: false, showInvalid: false,
      gun: "", cmp: [], cmpOpen: false
    };
  }
  var state = defaults();

  var favs = new Set();
  try {
    var raw = localStorage.getItem(FAV_KEY);
    if (raw) JSON.parse(raw).forEach(function (id) { favs.add(id); });
  } catch (e) { /* storage disabled */ }
  function saveFavs() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs))); } catch (e) {}
  }

  // ---------- url <-> state ----------
  function readHash() {
    var s = defaults();
    var h = location.hash.replace(/^#/, "");
    if (h) {
      var p = new URLSearchParams(h);
      if (p.has("tab")) s.tab = p.get("tab");
      if (p.has("cat")) s.cat = p.get("cat");
      if (p.has("sort")) s.sort = p.get("sort");
      if (p.has("min")) s.min = Number(p.get("min"));
      if (p.has("max")) s.max = Number(p.get("max"));
      if (p.has("np")) s.noPrice = p.get("np") === "1";
      if (p.has("fav")) s.favOnly = p.get("fav") === "1";
      if (p.has("inv")) s.showInvalid = p.get("inv") === "1";
      if (p.has("gun")) s.gun = p.get("gun");
      if (p.has("cmp")) s.cmp = p.get("cmp").split(",").filter(Boolean).slice(0, 3);
      if (p.has("cmpopen")) s.cmpOpen = p.get("cmpopen") === "1";
    }
    s.min = Math.max(G_MIN, Math.min(G_MAX, s.min));
    s.max = Math.max(G_MIN, Math.min(G_MAX, s.max));
    if (s.min > s.max) s.min = s.max;
    state = s;
  }
  function hashUrl() {
    var p = new URLSearchParams();
    if (state.tab) p.set("tab", state.tab);
    if (state.tab) p.set("tab", state.tab);
    if (state.cat) p.set("cat", state.cat);
    if (state.sort !== "gun") p.set("sort", state.sort);
    if (state.min > G_MIN) p.set("min", String(state.min));
    if (state.max < G_MAX) p.set("max", String(state.max));
    if (!state.noPrice) p.set("np", "0");
    if (state.favOnly) p.set("fav", "1");
    if (state.showInvalid) p.set("inv", "1");
    if (state.gun) p.set("gun", state.gun);
    if (state.cmp.length) p.set("cmp", state.cmp.join(","));
    if (state.cmp.length && state.cmpOpen) p.set("cmpopen", "1");
    var qs = p.toString();
    return { rel: location.pathname + location.search + (qs ? "#" + qs : ""),
             abs: location.origin + location.pathname + location.search + (qs ? "#" + qs : "") };
  }
  // mode: "replace" (filter tweaks) | "push" (进入/退出枪械详情) | "none"
  function writeHash(mode) {
    var u = hashUrl();
    if (mode === "push") history.pushState(null, "", u.rel);
    else if (mode !== "none") history.replaceState(null, "", u.rel);
    return u.abs;
  }
  function applyHash() { readHash(); syncControls(); render(); }

  // ---------- helpers ----------
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[<>&"]/g, function (c) {
      return { "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c];
    });
  }
  var toast = $("#toast"), toastTimer;
  function showToast(msg, ok) {
    toast.textContent = msg;
    toast.style.background = ok === false ? "var(--bad)" : "var(--ok)";
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 1500);
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (res, rej) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.cssText = "position:fixed;top:-1000px";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove(); res();
      } catch (e) { rej(e); }
    });
  }
  function priceText(r) { return r.price != null ? r.price + "W" : "未标价"; }

  // ---------- filtering ----------
  function filterRecords() {
    return ALL.filter(function (r) {
      if (state.tab && r.tab !== state.tab) return false;
      if (state.cat && r.cat !== state.cat) return false;
      if (state.favOnly && !favs.has(r.id)) return false;
      if (!state.showInvalid && r.invalid) return false;
      var narrowed = state.min > G_MIN || state.max < G_MAX;
      if (narrowed) {
        if (r.price == null) { if (!state.noPrice) return false; }
        else if (r.price < state.min || r.price > state.max) return false;
      }
      return true;
    });
  }
  function groupByGun(rows) {
    var map = {}, order = [];
    rows.forEach(function (r) {
      if (!map[r.gun]) { map[r.gun] = []; order.push(r.gun); }
      map[r.gun].push(r);
    });
    return order.map(function (gun) {
      var items = map[gun].slice().sort(function (a, b) {
        return (a.price == null ? 1e9 : a.price) - (b.price == null ? 1e9 : b.price) ||
          a.build.localeCompare(b.build, "zh");
      });
      var prices = items.map(function (r) { return r.price; }).filter(function (p) { return p != null; });
      var modes = [];
      items.forEach(function (r) { if (modes.indexOf(r.tab) < 0) modes.push(r.tab); });
      return {
        gun: gun, items: items, modes: modes,
        cat: items[0].cat,
        min: prices.length ? Math.min.apply(null, prices) : null,
        max: prices.length ? Math.max.apply(null, prices) : null,
        allFav: items.every(function (r) { return favs.has(r.id); })
      };
    });
  }

  function sortGroups(groups) {
    groups.sort(function (a, b) {
      if (state.sort === "count") return b.items.length - a.items.length || a.gun.localeCompare(b.gun, "zh");
      if (state.sort === "price") return (a.min == null ? 1e9 : a.min) - (b.min == null ? 1e9 : b.min);
      if (state.sort === "pricedesc") return (b.max == null ? -1 : b.max) - (a.max == null ? -1 : a.max);
      return a.gun.localeCompare(b.gun, "zh");
    });
    return groups;
  }

  // ---------- level 1 markup ----------
  function gunCard(g) {
    var range = g.min == null ? "未标价"
      : (g.min === g.max ? g.min + "W" : g.min + "w–" + g.max + "w");
    var preview = g.items.map(function (r) { return r.build || "未命名"; }).join(" · ");
    var gone = g.items.filter(function (r) { return r.invalid; }).length;
    var fresh = g.items.filter(function (r) { return r.userAdded; }).length;
    return '<article class="gun-card' + (g.allFav ? " fav" : "") + '" data-gun="' + esc(g.gun) + '">' +
      '<div class="gc-head">' +
        '<div class="gc-name">' + esc(g.gun) + "</div>" +
        '<div class="spacer"></div>' +
        '<button class="icon-btn star' + (g.allFav ? " on" : "") + '" data-act="favgun" title="收藏这把枪的全部方案">' +
          (g.allFav ? "★" : "☆") + "</button>" +
      "</div>" +
      gunImgTag(g.gun, "gc-img") +
      '<div class="gc-badges">' +
        '<span class="badge">' + esc(g.cat) + "</span>" +
        '<span class="badge">' + g.items.length + " 套</span>" +
        '<span class="badge price">' + range + "</span>" +
        (gone ? '<span class="badge gone">' + gone + " 已失效</span>" : "") +
        (fresh ? '<span class="badge mine">' + fresh + " 网友新增</span>" : "") +
        g.modes.map(function (m) { return '<span class="badge mode">' + esc(m) + "</span>"; }).join("") +
      "</div>" +
      '<div class="gc-preview">' + esc(preview) + "</div>" +
      '<div class="gc-go">查看 ' + g.items.length + " 个价位的改枪码 →</div>" +
      "</article>";
  }

  // ---------- level 2 markup ----------
  function buildRow(r) {
    var isFav = favs.has(r.id), isCmp = state.cmp.indexOf(r.id) >= 0;
    var canEdit = !!API && apiOnline;
    return '<div class="build-item' + (isFav ? " fav" : "") + (r.invalid ? " invalid" : "") +
        '" data-id="' + esc(r.id) + '">' +
      '<div class="bi-left">' +
        '<div class="bi-build">' + (r.build ? esc(r.build) : '<span style="color:var(--dim2)">默认/未命名</span>') + "</div>" +
        '<div class="bi-sub">' +
          '<span class="badge price">' + priceText(r) + "</span>" +
          '<span class="badge mode">' + esc(r.tab) + "</span>" +
          (r.invalid ? '<span class="badge gone">已失效</span>' : "") +
          (r.userAdded ? '<span class="badge mine">网友新增</span>' : "") +
          (r.author ? '<span class="badge author">由 ' + esc(r.author) + " 添加</span>" : "") +
        "</div>" +
      "</div>" +
      '<div class="bi-code">' + esc(r.code) + "</div>" +
      '<div class="bi-acts">' +
        '<button class="icon-btn star' + (isFav ? " on" : "") + '" data-act="fav" title="收藏">' +
          (isFav ? "★" : "☆") + "</button>" +
        '<button class="icon-btn cmp' + (isCmp ? " on" : "") + '" data-act="cmp" title="加入对比">⇄</button>' +
        (canEdit ? '<button class="icon-btn flag' + (r.invalid ? " on" : "") + '" data-act="flag" title="' +
          (r.invalid ? "恢复这条码" : "标记为失效") + '">' + (r.invalid ? "↺" : "⊘") + "</button>" : "") +
        '<button class="copy" data-code="' + esc(r.code) + '">复制</button>' +
      "</div>" +
      "</div>";
  }
  function detailHtml(g, filteredCount) {
    return '<div class="detail-head">' +
        '<button class="back" id="back">← 返回全部枪械</button>' +
        gunImgTag(g.gun, "dh-img") +
        "<div>" +
          '<div class="title">' + esc(g.gun) + "</div>" +
          '<div class="meta">' + esc(g.cat) + " · " + g.items.length + " 套方案 · 价格 " +
            (g.min == null ? "未标价" : (g.min === g.max ? g.min + "W" : g.min + "w–" + g.max + "w")) +
            (filteredCount > g.items.length ? "（筛选后 " + g.items.length + " 套 / 全部 " + filteredCount + " 套）" : "") +
          "</div>" +
        "</div>" +
        '<div class="acts">' +
          '<button class="btn" data-act="copygun">复制全部 ' + g.items.length + " 个码</button>" +
          '<button class="btn' + (g.allFav ? " on" : "") + '" data-act="favgun">' +
            (g.allFav ? "★ 已收藏" : "☆ 收藏全部") + "</button>" +
        "</div>" +
      "</div>" +
      '<div class="builds">' + g.items.map(buildRow).join("") + "</div>";
  }

  // ---------- render ----------
  function renderTabs() {
    function gunsIn(pred) {
      var s = {};
      ALL.forEach(function (r) { if (pred(r)) s[r.gun] = 1; });
      return Object.keys(s).length;
    }
    var items = [["", "全部", gunsIn(function () { return true; })]].concat(
      D.modes.map(function (m) {
        return [m, m, gunsIn(function (r) { return r.tab === m; })];
      })
    );
    var html = items.map(function (it) {
      return '<div class="tab' + (state.tab === it[0] ? " on" : "") + '" data-tab="' + esc(it[0]) + '">' +
        esc(it[1]) + '<span class="n">' + it[2] + "</span></div>";
    }).join("");
    if (favs.size) {
      var favGuns = {};
      ALL.forEach(function (r) { if (favs.has(r.id)) favGuns[r.gun] = 1; });
      html += '<div class="tab' + (state.favOnly ? " on" : "") + '" data-tab="__fav">★ 收藏' +
        '<span class="n">' + Object.keys(favGuns).length + "</span></div>";
    }
    $("#tabs").innerHTML = html;
  }

  function renderCats() {
    var guns = {};
    ALL.forEach(function (r) {
      if (state.tab && r.tab !== state.tab) return;
      (guns[r.cat] = guns[r.cat] || {})[r.gun] = 1;
    });
    var counts = {};
    Object.keys(guns).forEach(function (c) { counts[c] = Object.keys(guns[c]).length; });
    var order = CATS.map(function (c) { return c[0]; }).filter(function (c) { return counts[c]; });
    if (counts["其他"]) order.push("其他");
    var total = 0;
    Object.keys(counts).forEach(function (k) { total += counts[k]; });
    var html = '<div class="pill' + (state.cat === "" ? " on" : "") + '" data-cat="">全部类型' +
      '<span class="n">' + total + "</span></div>";
    html += order.map(function (c) {
      return '<div class="pill' + (state.cat === c ? " on" : "") + '" data-cat="' + esc(c) + '">' +
        esc(c) + '<span class="n">' + counts[c] + "</span></div>";
    }).join("");
    $("#cats").innerHTML = html;
  }

  function render() {
    var rows = filterRecords();
    var groups = sortGroups(groupByGun(rows));
    $("#s-guns").textContent = groups.length;
    $("#s-codes").textContent = rows.length;
    $("#s-total").textContent = ALL.length;
    renderTabs();
    renderCats();

    var gunsEl = $("#guns"), detailEl = $("#detail");
    var current = null;
    if (state.gun) {
      for (var i = 0; i < groups.length; i++) if (groups[i].gun === state.gun) { current = groups[i]; break; }
    }

    if (current) {
      var allForGun = ALL.filter(function (r) { return r.gun === current.gun; }).length;
      gunsEl.hidden = true; gunsEl.innerHTML = "";
      detailEl.hidden = false;
      detailEl.innerHTML = detailHtml(current, allForGun);
    } else {
      detailEl.hidden = true; detailEl.innerHTML = "";
      gunsEl.hidden = false;
      if (state.cat) {
        // one category selected -> flat grid
        gunsEl.innerHTML = '<div class="grid">' + groups.map(gunCard).join("") + "</div>";
      } else {
        // group the cards under category headings
        var byCat = {}, order = [];
        groups.forEach(function (g) {
          if (!byCat[g.cat]) { byCat[g.cat] = []; order.push(g.cat); }
          byCat[g.cat].push(g);
        });
        var rank = {};
        CATS.forEach(function (c, idx) { rank[c[0]] = idx; });
        order.sort(function (a, b) {
          return (rank[a] == null ? 99 : rank[a]) - (rank[b] == null ? 99 : rank[b]);
        });
        gunsEl.innerHTML = order.map(function (c) {
          return '<section class="cat-section">' +
            '<h2 class="cat-title">' + esc(c) +
              '<span class="cnt">' + byCat[c].length + " 把枪 · " +
              byCat[c].reduce(function (n, g) { return n + g.items.length; }, 0) + " 套方案</span></h2>" +
            '<div class="grid">' + byCat[c].map(gunCard).join("") + "</div></section>";
        }).join("");
      }
    }
    $("#empty").hidden = groups.length > 0;
    renderCmpBar();
    writeHash("replace");
  }

  function renderCmpBar() {
    var bar = $("#cmpbar");
    if (!state.cmp.length) { bar.hidden = true; $("#cmpchips").innerHTML = ""; return; }
    bar.hidden = false;
    $("#cmpchips").innerHTML = state.cmp.map(function (id) {
      var r = byId[id];
      return '<span class="chip"><b>' + esc(r ? r.gun : id) + "</b> " +
        esc(r && r.build ? r.build : "") + "</span>";
    }).join("");
  }

  // ---------- compare modal ----------
  var CMP_ROWS = [
    ["枪械", function (r) { return esc(r.gun); }, "txt"],
    ["改装", function (r) { return r.build ? esc(r.build) : "—"; }, "txt"],
    ["价格", function (r) { return r.price != null ? r.price + "W" : "未标价"; }, "txt"],
    ["玩法", function (r) { return esc(r.tab); }, "txt"],
    ["类型", function (r) { return esc(r.cat); }, "txt"],
    ["改枪码", function (r) { return esc(r.code); }, "code"],
  ];
  function openCompare() {
    var rs = state.cmp.map(function (id) { return byId[id]; }).filter(Boolean);
    if (!rs.length) return;
    var ps = rs.map(function (r) { return r.price == null ? null : r.price; })
               .filter(function (p) { return p != null; });
    var minP = ps.length ? Math.min.apply(null, ps) : null;
    var maxP = ps.length ? Math.max.apply(null, ps) : null;
    var html = '<div class="modal" id="modal"><div class="modal-in">' +
      '<h2>方案对比<span class="x"><button class="btn" id="modalClose">关闭</button></span></h2>' +
      '<table class="cmp"><tbody>' +
      CMP_ROWS.map(function (row) {
        return "<tr><th>" + row[0] + "</th>" + rs.map(function (r) {
          var v = row[1](r);
          var cls = row[2] === "code" ? "" : ' class="txt"';
          if (row[0] === "价格" && r.price != null && minP !== maxP) {
            if (r.price === minP) v = '<span class="best">' + v + " ↓最低</span>";
            else if (r.price === maxP) v = v + " ↑最高";
          }
          return "<td" + cls + ">" + v + "</td>";
        }).join("") + "</tr>";
      }).join("") +
      '<tr><th>操作</th>' + rs.map(function (r) {
        return '<td class="txt"><button class="copy" data-code="' + esc(r.code) + '">复制码</button></td>';
      }).join("") + "</tr>" +
      "</tbody></table></div></div>";
    $("#modalHost").innerHTML = html;
    $("#modalClose").onclick = closeModal;
    $("#modal").addEventListener("click", function (e) { if (e.target.id === "modal") closeModal(); });
    state.cmpOpen = true; writeHash("replace");
  }
  function closeModal() {
    $("#modalHost").innerHTML = "";
    state.cmpOpen = false; writeHash("replace");
  }

  // ---------- 新增改枪码 ----------
  function openAddForm() {
    if (!API) { showToast("当前是只读模式，还没配后端", false); return; }
    var opts = (D.modes || []).map(function (m) {
      return '<option value="' + esc(m) + '">' + esc(m) + "</option>";
    }).join("");
    $("#modalHost").innerHTML =
      '<div class="modal" id="modal"><div class="modal-in" style="max-width:540px">' +
      '<h2>新增改枪码<span class="x"><button class="btn" id="modalClose">关闭</button></span></h2>' +
      '<div class="form-grid">' +
        '<label><b>枪械名 *</b><input id="f-gun" maxlength="24" placeholder="例如 M14射手步枪" /></label>' +
        '<label><b>改装名 / 价位</b><input id="f-build" maxlength="40" placeholder="例如 45w满改倍镜（可不填）" /></label>' +
        '<label><b>玩法 *</b><select id="f-tab">' + opts + "</select></label>" +
        '<label><b>改枪码 *</b><input id="f-code" maxlength="32" placeholder="例如 6L6JE9S01SD6JA3I74O3I" />' +
          '<span class="hint">只填游戏里复制出来的那一串，不要带「枪械-玩法-」前缀和横杠</span></label>' +
        '<label><b>新建人名字 *</b><input id="f-author" maxlength="16" placeholder="填你的名字或游戏 ID" /></label>' +
        '<div class="form-err" id="f-err"></div>' +
        '<div class="form-actions">' +
          '<button class="btn" id="f-cancel">取消</button>' +
          '<button class="btn primary" id="f-submit">提交</button>' +
        "</div>" +
      "</div></div></div>";
    $("#modalClose").onclick = closeModal;
    $("#f-cancel").onclick = closeModal;
    $("#modal").addEventListener("click", function (e) { if (e.target.id === "modal") closeModal(); });

    $("#f-submit").onclick = function () {
      var btn = $("#f-submit"), err = $("#f-err");
      var payload = {
        gun: $("#f-gun").value.trim(),
        build: $("#f-build").value.trim(),
        tab: $("#f-tab").value,
        code: $("#f-code").value.trim(),
        author: $("#f-author").value.trim()
      };
      err.textContent = "";
      if (!payload.gun || !payload.code || !payload.author) {
        err.textContent = "枪械名、改枪码、新建人名字 三项必填";
        return;
      }
      if (!/^[0-9A-Za-z]{8,32}$/.test(payload.code)) {
        err.textContent = "改枪码格式看起来不对（应为 8–32 位字母数字）";
        return;
      }
      var dup = ALL.filter(function (r) { return r.code === payload.code; })[0];
      if (dup) { err.textContent = "这条码已经在列表里了（" + dup.gun + "）"; return; }

      btn.disabled = true; btn.textContent = "提交中…";
      apiPost("/api/add", payload)
        .then(function () { return apiGetChanges(); })
        .then(function () {
          closeModal(); render();
          showToast("已提交，感谢 " + payload.author + "！");
        })
        .catch(function (e) {
          err.textContent = (e && e.message) || "提交失败，稍后再试";
          btn.disabled = false; btn.textContent = "提交";
        });
    };
    setTimeout(function () { var el = $("#f-gun"); if (el) el.focus(); }, 40);
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if ($("#modal")) closeModal(); else if (state.gun) closeGun(); }
  });

  // ---------- actions ----------
  function openGun(gun) { state.gun = gun; writeHash("push"); render(); window.scrollTo(0, 0); }
  function closeGun() { state.gun = ""; writeHash("push"); render(); window.scrollTo(0, 0); }

  function toggleFav(id) {
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavs(); render();
  }
  function toggleCmp(id) {
    var i = state.cmp.indexOf(id);
    if (i >= 0) state.cmp.splice(i, 1);
    else if (state.cmp.length >= 3) { showToast("最多同时对比 3 套", false); return; }
    else state.cmp.push(id);
    render();
  }
  function gunRecords(gun) {
    return filterRecords().filter(function (r) { return r.gun === gun; });
  }
  function toggleFavGun(gun) {
    var items = gunRecords(gun);
    var allFav = items.length > 0 && items.every(function (r) { return favs.has(r.id); });
    items.forEach(function (r) { if (allFav) favs.delete(r.id); else favs.add(r.id); });
    saveFavs(); render();
  }

  // ---------- events ----------
  $("#cats").addEventListener("click", function (e) {
    var el = e.target.closest(".pill"); if (!el) return;
    state.cat = el.dataset.cat || "";
    state.gun = "";
    render();
  });
  $("#sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });
  $("#noPrice").addEventListener("change", function (e) { state.noPrice = e.target.checked; render(); });
  $("#favOnly").addEventListener("change", function (e) { state.favOnly = e.target.checked; render(); });
  $("#showInv").addEventListener("change", function (e) { state.showInvalid = e.target.checked; render(); });
  $("#addBtn").addEventListener("click", openAddForm);
  function onPrice() {
    var a = Number($("#pmin").value), b = Number($("#pmax").value);
    if (a > b) { if (this && this.id === "pmin") b = a; else a = b; }
    state.min = a; state.max = b;
    $("#pmin").value = a; $("#pmax").value = b;
    $("#pval").textContent = a + "w – " + b + "w";
    render();
  }
  $("#pmin").addEventListener("input", onPrice);
  $("#pmax").addEventListener("input", onPrice);
  $("#share").addEventListener("click", function () {
    copyText(hashUrl().abs).then(function () { showToast("链接已复制，含当前筛选"); },
      function () { showToast("复制失败", false); });
  });
  $("#reset").addEventListener("click", function () {
    var cmp = state.cmp;
    state = defaults(); state.cmp = cmp;
    syncControls(); render();
  });
  $("#brand").addEventListener("click", function () { if (state.gun) closeGun(); });
  $("#tabs").addEventListener("click", function (e) {
    var el = e.target.closest(".tab"); if (!el) return;
    var t = el.dataset.tab;
    if (t === "__fav") state.favOnly = !state.favOnly;
    else state.tab = t;
    state.gun = "";
    syncControls(); render();
  });
  $("#cmpOpen").addEventListener("click", openCompare);
  $("#cmpClear").addEventListener("click", function () { state.cmp = []; render(); });

  document.addEventListener("click", function (e) {
    var copyBtn = e.target.closest(".copy");
    if (copyBtn) {
      copyText(copyBtn.dataset.code).then(function () {
        copyBtn.classList.add("done");
        var old = copyBtn.textContent; copyBtn.textContent = "✓";
        setTimeout(function () { copyBtn.classList.remove("done"); copyBtn.textContent = old; }, 1100);
        showToast("已复制 " + copyBtn.dataset.code.slice(-6));
      }, function () { showToast("复制失败，请手动选择", false); });
      return;
    }
    if (e.target.closest("#back")) { closeGun(); return; }

    var act = e.target.closest("[data-act]");
    if (act) {
      var a = act.dataset.act;
      var holder = act.closest("[data-gun]");
      var gun = holder ? holder.dataset.gun : state.gun;
      if (a === "fav") { toggleFav(act.closest("[data-id]").dataset.id); return; }
      if (a === "cmp") { toggleCmp(act.closest("[data-id]").dataset.id); return; }
      if (a === "flag") {
        var rec = byId[act.closest("[data-id]").dataset.id];
        if (!rec) return;
        var next = rec.invalid ? "valid" : "invalid";
        act.disabled = true;
        apiPost("/api/flag", { target_id: rec.id, status: next })
          .then(function () { return apiGetChanges(); })
          .then(function () {
            render();
            showToast(next === "invalid" ? "已标记为失效" : "已恢复");
          })
          .catch(function (e) {
            act.disabled = false;
            showToast((e && e.message) || "操作失败", false);
          });
        return;
      }
      if (a === "favgun") { toggleFavGun(gun); return; }
      if (a === "copygun") {
        var items = gunRecords(gun);
        if (!items.length) { showToast("当前筛选下没有可复制的方案", false); return; }
        copyText(items.map(function (r) { return r.code; }).join("\n")).then(function () {
          showToast("已复制 " + gun + " 的 " + items.length + " 个改枪码");
        }, function () { showToast("复制失败", false); });
        return;
      }
      return;
    }

    var card = e.target.closest(".gun-card");
    if (card) { openGun(card.dataset.gun); }
  });

  // ---------- boot ----------
  function syncControls() {
    $("#sort").value = state.sort;
    $("#noPrice").checked = state.noPrice;
    $("#favOnly").checked = state.favOnly;
    $("#showInv").checked = state.showInvalid;
    $("#pmin").value = state.min; $("#pmax").value = state.max;
    $("#pval").textContent = state.min + "w – " + state.max + "w";
  }

  $("#sub").textContent = "共 " + BASE.length + " 条 · " + D.modes.length + " 种玩法 · " + D.withPrice + " 条标价";
  $("#foot-note").textContent = D.footerNote || "";
  $("#foot-copy").textContent = D.copyright || "";
  $("#foot-stats").textContent = "收录 " + ALL.length + " 个改枪码 / " +
    new Set(ALL.map(function (r) { return r.gun; })).size + " 把枪械；" +
    D.modes.map(function (m) {
      return m + " " + ALL.filter(function (r) { return r.tab === m; }).length;
    }).join(" · ");

  var notices = (D.notices || []).filter(function (n) { return n && n.length > 3; });
  if (notices.length) {
    $("#notice").hidden = false;
    $("#notice-list").innerHTML = notices.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("");
  }
  var cats = [];

  $("#pmin").min = G_MIN; $("#pmin").max = G_MAX; $("#pmin").step = 1;
  $("#pmax").min = G_MIN; $("#pmax").max = G_MAX; $("#pmax").step = 1;

  readHash();
  rebuildAll();
  $("#addBtn").hidden = !API;
  syncControls();
  render();
  if (state.cmpOpen && state.cmp.length) openCompare();
  window.addEventListener("popstate", applyHash);

  if (API) {
    apiGetChanges().then(function (ok) {
      if (!ok) showToast("后端连不上，暂时只读", false);
      render();
    });
  } else {
    $("#foot-note").textContent = (D.footerNote || "") + "　当前为只读模式（未配置编辑后端）。";
  }
})();
</script>
</body>
</html>
