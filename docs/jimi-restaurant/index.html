<!DOCTYPE html>
<html lang="zh-CN" data-base="../">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>基米餐馆 · 哈基米工具箱</title>
<meta name="description" content="基米餐馆：川粤鲁苏浙闽湘徽、东北菜、家常小炒、烧烤、火锅、小吃、汤羹、饮品甜品，点菜下单。" />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="stylesheet" href="../assets/theme.css" />
<style>
  /* ---------- 密码门 ---------- */
  .gate{max-width:440px;margin:9vh auto 0;border-radius:24px;padding:34px 30px 30px;text-align:center;
    background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.66) 48%,rgba(255,255,255,.8));
    border:1px solid rgba(255,255,255,.95);border-top-color:#fff;
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--inset),0 18px 50px rgba(20,40,65,.12)}
  .gate .lock{font-size:46px;line-height:1;margin-bottom:12px;filter:drop-shadow(0 6px 12px rgba(226,112,10,.25))}
  .gate h2{margin:0 0 6px;font-size:21px;letter-spacing:.5px}
  .gate p{margin:0 0 22px;font-size:13px;color:var(--dim2);line-height:1.7}
  .gate .pin{display:flex;gap:10px}
  .gate input{flex:1;text-align:center;font-size:20px;letter-spacing:8px;padding:14px 12px;border-radius:14px;
    font-family:var(--mono);color:var(--txt);background:rgba(255,255,255,.85);
    border:1px solid rgba(20,40,65,.16);box-shadow:inset 0 1px 0 #fff;outline:none}
  .gate input:focus{border-color:rgba(226,112,10,.5);box-shadow:0 0 0 3px rgba(226,112,10,.12),inset 0 1px 0 #fff}
  .gate .err{min-height:20px;margin-top:12px;font-size:12.5px;color:var(--bad)}
  .gate .hintline{margin-top:16px;font-size:11.5px;color:var(--dim2)}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* ---------- 菜单布局 ---------- */
  .shop{display:grid;grid-template-columns:186px 1fr;gap:20px;margin-top:22px;align-items:start}
  .side{position:sticky;top:86px;border-radius:20px;padding:12px;
    background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.6));
    border:1px solid rgba(255,255,255,.95);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--inset),var(--shadow);max-height:calc(100vh - 110px);overflow:auto}
  .side button{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:12px;
    border:0;background:transparent;cursor:pointer;font:inherit;font-size:13.5px;color:var(--dim);
    text-align:left;transition:background .16s,color .16s}
  .side button:hover{background:rgba(255,255,255,.7)}
  .side button.on{color:var(--txt);font-weight:600;background:rgba(255,197,143,.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
  .side button .em{font-size:16px;width:20px;text-align:center}
  .side button .n{margin-left:auto;font-size:11.5px;color:var(--dim2);font-family:var(--mono)}

  .main{min-width:0}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .bar input[type=search]{flex:1;min-width:170px;padding:11px 14px;border-radius:13px;font-size:13.5px;
    font-family:inherit;color:var(--txt);background:rgba(255,255,255,.8);
    border:1px solid rgba(20,40,65,.14);box-shadow:inset 0 1px 0 #fff;outline:none}
  .bar input[type=search]:focus{border-color:rgba(226,112,10,.45)}

  .chead{margin:2px 0 14px}
  .chead h2{margin:0 0 4px;font-size:19px}
  .chead p{margin:0;font-size:12.5px;color:var(--dim2)}

  .dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
  .dish{position:relative;border-radius:16px;padding:14px 15px;display:flex;flex-direction:column;gap:7px;
    background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.64));
    border:1px solid rgba(255,255,255,.95);box-shadow:var(--inset),0 6px 18px rgba(20,40,65,.06);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:transform .16s,box-shadow .16s}
  .dish:hover{transform:translateY(-2px);box-shadow:var(--inset),0 12px 26px rgba(20,40,65,.1)}
  .dish.in{border-color:rgba(226,112,10,.42);background:linear-gradient(160deg,rgba(255,240,225,.9),rgba(255,255,255,.7))}
  .dish .top{display:flex;align-items:baseline;gap:8px}
  .dish .top .badge{margin-left:auto}
  .dish .nm{font-weight:600;font-size:15px;letter-spacing:.2px}
  .dish .ds{font-size:12px;color:var(--dim2);line-height:1.6;min-height:19px}
  .dish .foot{display:flex;align-items:center;gap:7px;margin-top:2px}
  .dish .sp{font-size:11px;letter-spacing:-1px}
  .step{display:flex;align-items:center;gap:6px;margin-left:auto}
  .step button{width:27px;height:27px;border-radius:9px;border:1px solid rgba(20,40,65,.16);
    background:rgba(255,255,255,.85);cursor:pointer;font-size:15px;line-height:1;color:var(--dim);
    display:flex;align-items:center;justify-content:center;padding:0;transition:all .14s}
  .step button:hover:not(:disabled){color:var(--accent);border-color:rgba(226,112,10,.5);
    background:rgba(255,228,203,.8)}
  .step button:disabled{opacity:.35;cursor:default}
  .step .q{min-width:22px;text-align:center;font-family:var(--mono);font-size:13.5px;font-weight:600}

  /* ---------- 底部购物车条 ---------- */
  .cartbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
    display:flex;align-items:center;gap:14px;padding:11px 12px 11px 20px;border-radius:999px;
    background:linear-gradient(140deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
    border:1px solid rgba(255,255,255,.98);box-shadow:0 14px 40px rgba(20,40,65,.16),inset 0 1px 0 #fff;
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    transition:transform .24s cubic-bezier(.2,.9,.3,1.4),opacity .2s}
  .cartbar[hidden]{display:none}
  .cartbar .sum{font-size:13px;color:var(--dim)}
  .cartbar .sum b{font-family:var(--mono);font-size:16px;color:var(--accent2);margin-left:3px}
  .cartbar .sep{width:1px;height:22px;background:rgba(20,40,65,.12)}

  /* ---------- 小票 ---------- */
  #r-img{display:block;margin:0 auto}

  .empty-tip{text-align:center;padding:44px 0;color:var(--dim2);font-size:13.5px}

  @media (max-width:760px){
    .shop{grid-template-columns:1fr;gap:12px}
    .side{position:static;max-height:none;display:flex;gap:7px;overflow-x:auto;padding:10px;
      scrollbar-width:none}
    .side::-webkit-scrollbar{display:none}
    .side button{width:auto;white-space:nowrap;padding:8px 14px;border-radius:999px;
      background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.95)}
    .side button .n{display:none}
    .side button.on{background:rgba(255,197,143,.6)}
    .dishes{grid-template-columns:1fr}
    .cartbar{left:14px;right:14px;bottom:14px;transform:none;justify-content:space-between;padding-left:16px}
    .gate{margin-top:5vh;padding:26px 20px}
  }
</style>
</head>
<body>
<div class="grain"></div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="../">
      <div class="mark">🍚</div>
      <div>
        <h1>基米餐馆</h1>
        <div class="sub" id="sub">今天想吃点什么？</div>
      </div>
    </a>
    <div class="stats">
      <div class="stat" id="s-cui" hidden>菜系 <b>0</b></div>
      <div class="stat" id="s-dish" hidden>菜品 <b>0</b></div>
      <div class="stat" id="s-api" hidden>接口 <b>—</b></div>
      <button class="stat" id="s-lock" hidden>🔒 <b>退出</b></button>
    </div>
  </div>
  <nav class="fnav" id="siteNav"></nav>
</header>

<div class="wrap">

  <!-- 密码门 -->
  <section class="gate" id="gate">
    <div class="lock">🔒</div>
    <h2>基米餐馆</h2>
    <p>这里是内部食堂，进门要密码<br>密码问老板要</p>
    <div class="pin">
      <input id="pwd" type="password" inputmode="numeric" autocomplete="off"
             maxlength="20" placeholder="••••" aria-label="进门密码" />
    </div>
    <div class="err" id="err"></div>
    <button class="btn primary" id="go" style="width:100%;padding:13px;font-size:15px">进 门</button>
    <div class="hintline">通过后 12 小时内不用再输</div>
  </section>

  <!-- 菜单 -->
  <section id="app" hidden>
    <div class="shop">
      <aside class="side" id="cuisines"></aside>
      <div class="main">
        <div class="bar">
          <input type="search" id="q" placeholder="搜菜名，比如「鱼」「豆腐」「奶茶」" />
          <select id="spicy" title="辣度筛选">
            <option value="-1">不限辣度</option>
            <option value="0">不辣</option>
            <option value="1">微辣</option>
            <option value="2">中辣</option>
            <option value="3">特辣</option>
          </select>
          <button class="btn ghost" id="lucky" title="随便点一道">🎲 随便来一个</button>
        </div>
        <div class="chead" id="chead"></div>
        <div class="dishes" id="dishes"></div>
        <div class="empty-tip" id="nores" hidden>没找到这道菜，换个词试试</div>
      </div>
    </div>
    <footer style="margin-top:36px">
      <div id="foot-note"></div>
      <div id="foot-copy"></div>
    </footer>
  </section>
</div>

<div class="cartbar" id="cartbar" hidden>
  <span class="sum">已点 <b id="c-count">0</b> 样菜</span>
  <span class="sep"></span>
  <button class="btn ghost" id="c-clear" style="padding:8px 14px">清空</button>
  <button class="btn primary" id="c-order" style="padding:8px 18px">下单</button>
</div>

<div id="modalHost"></div>
<button class="totop" id="toTop" title="回到顶部" aria-label="回到顶部">↑</button>
<div class="toast" id="toast">已复制</div>

<script src="../assets/site.js"></script>
<script>
(function () {
  "use strict";

  var TOKEN_KEY = "jimi-restaurant-token-v1";
  var CART_KEY  = "jimi-restaurant-cart-v1";
  /* 后端就在同一台服务器上，走 nginx 反代的 /api/*。
     GitHub 镜像和本地打开的 html 没有后端（菜单只在服务器上），
     所以那种情况直接给个提示，别让人对着转圈的按钮发呆。 */
  var MIRROR = location.protocol === "file:" ||
    /(^|\.)github\.io$/.test(location.hostname);
  var API = "";

  var token = "";
  try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { token = ""; }

  var MENU = null;                                // {cuisines:[…]}
  var cart = {};                                  // "菜系id|菜名" -> 数量
  var cur = "";                                   // 当前菜系 id
  var q = "";
  var spicy = -1;

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function allDishes() {
    var out = [];
    (MENU ? MENU.cuisines : []).forEach(function (c) {
      c.dishes.forEach(function (d) { out.push({ c: c, d: d, key: c.id + "|" + d.name }); });
    });
    return out;
  }
  function cartCount() { var n = 0; for (var k in cart) n += cart[k]; return n; }
  function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {} }
  function loadCart() {
    try {
      var raw = localStorage.getItem(CART_KEY);
      cart = raw ? JSON.parse(raw) : {};
      if (!cart || typeof cart !== "object") cart = {};
    } catch (e) { cart = {}; }
  }

  var toastTimer = null;
  function toast(msg, ok) {
    var t = $("#toast");
    t.textContent = msg;
    t.style.background = ok === false ? "rgba(214,69,69,.94)" : "";
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 1900);
  }

  function setStat(id, val) {
    var el = $(id);
    if (!el) return;
    if (val == null) { el.hidden = true; return; }
    el.hidden = false;
    el.querySelector("b").textContent = val;
  }

  // ---------- 密码门 ----------
  function showGate(msg) {
    $("#gate").hidden = false;
    $("#app").hidden = true;
    setStat("#s-cui", null); setStat("#s-dish", null);
    setStat("#s-api", null); setStat("#s-lock", null);
    $("#cartbar").hidden = true;
    if (msg) $("#err").textContent = msg;
    setTimeout(function () { $("#pwd").focus(); }, 60);
  }

  function unlock() {
    var pwd = $("#pwd").value;
    var err = $("#err"), btn = $("#go");
    if (!pwd) { err.textContent = "请输入密码"; return; }
    err.textContent = "";
    btn.disabled = true; btn.textContent = "验证中…";
    setStat("#s-api", "连接中…");
    fetch(API + "/api/restaurant/unlock", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pwd })
    }).then(function (r) {
      return r.json()["catch"](function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error((d && d.error) || ("HTTP " + r.status));
        return d;
      });
    }).then(function (d) {
      token = d.token;
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
      $("#pwd").value = "";
      return fetchMenu();
    })["catch"](function (e) {
      err.textContent = (e && e.message) || "验证失败";
      $("#gate").classList.add("shake");
      setTimeout(function () { $("#gate").classList.remove("shake"); }, 340);
      setStat("#s-api", null);
      btn.disabled = false; btn.textContent = "进 门";
    });
  }

  function lockOut(msg) {
    token = "";
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    showGate(msg || "");
    $("#go").disabled = false; $("#go").textContent = "进 门";
  }

  // ---------- 取菜单 ----------
  function fetchMenu() {
    return fetch(API + "/api/restaurant/menu", {
      headers: { Authorization: "Bearer " + token }
    }).then(function (r) {
      return r.json()["catch"](function () { return {}; }).then(function (d) {
        if (r.status === 401) { lockOut(d.error || "请重新输入密码"); throw new Error("__gate__"); }
        if (!r.ok) throw new Error((d && d.error) || ("HTTP " + r.status));
        return d;
      });
    }).then(function (d) {
      MENU = d;
      setStat("#s-api", "已连接");
      return true;
    })["catch"](function (e) {
      if (e && e.message === "__gate__") return false;
      setStat("#s-api", "连不上");
      showGate("服务器连不上，稍后再试");
      throw e;
    });
  }

  // ---------- 渲染 ----------
  function renderCuisines() {
    $("#cuisines").innerHTML = MENU.cuisines.map(function (c) {
      var n = c.dishes.reduce(function (a, d) { return a + (cart[c.id + "|" + d.name] || 0); }, 0);
      return '<button data-c="' + esc(c.id) + '"' + (c.id === cur ? ' class="on"' : "") + ">" +
        '<span class="em">' + esc(c.emoji) + "</span>" + esc(c.name) +
        '<span class="n">' + (n ? "已点 " + n : c.dishes.length) + "</span></button>";
    }).join("");
  }

  function dishCard(c, d) {
    var key = c.id + "|" + d.name;
    var n = cart[key] || 0;
    var sp = d.spicy > 0 ? '<span class="sp" title="辣度 ' + d.spicy + '/3">' +
      "🌶️".repeat(d.spicy) + "</span>" : "";
    var tag = d.tag ? '<span class="badge">' + esc(d.tag) + "</span>" : "";
    return '<div class="dish' + (n ? " in" : "") + '" data-key="' + esc(key) + '">' +
      '<div class="top"><span class="nm">' + esc(d.name) + "</span>" + tag + "</div>" +
      '<div class="ds">' + esc(d.desc || "") + "</div>" +
      '<div class="foot">' + sp +
        '<span class="step">' +
          '<button data-act="minus"' + (n ? "" : " disabled") + ' aria-label="减一份">−</button>' +
          '<span class="q">' + n + "</span>" +
          '<button data-act="plus" aria-label="加一份">+</button>' +
        "</span></div></div>";
  }

  function renderDishes() {
    var c = MENU.cuisines.filter(function (x) { return x.id === cur; })[0];
    if (!c) return;
    var terms = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var searchAll = terms.length > 0 || spicy >= 0;
    var list = searchAll ? allDishes() : c.dishes.map(function (d) { return { c: c, d: d }; });

    var rows = list.filter(function (x) {
      if (spicy >= 0 && x.d.spicy !== spicy) return false;
      if (!terms.length) return true;
      var hay = (x.d.name + " " + (x.d.desc || "") + " " + x.c.name).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    });

    if (searchAll) {
      $("#chead").innerHTML = "<h2>搜索结果</h2><p>共 " + rows.length + " 道" +
        (q ? "，关键词「" + esc(q) + "」" : "") + "</p>";
    } else {
      $("#chead").innerHTML = "<h2>" + esc(c.emoji + " " + c.name) + "</h2><p>" +
        esc(c.desc) + "　·　" + c.dishes.length + " 道</p>";
    }

    $("#nores").hidden = rows.length > 0;
    $("#dishes").innerHTML = rows.map(function (x) { return dishCard(x.c, x.d); }).join("");
  }

  function renderCart() {
    var n = cartCount();
    var bar = $("#cartbar");
    if (!n) { bar.hidden = true; return; }
    bar.hidden = false;
    $("#c-count").textContent = n;
  }

  function render() {
    if (!MENU) return;
    renderCuisines();
    renderDishes();
    renderCart();
    setStat("#s-cui", MENU.cuisines.length);
    setStat("#s-dish", allDishes().length);
    setStat("#s-lock", "退出");
  }

  // ---------- 小票（用 canvas 画，能存成图片） ----------
  function receiptData() {
    var items = [], byKey = {};
    allDishes().forEach(function (x) { byKey[x.key] = x; });
    MENU.cuisines.forEach(function (c) {
      c.dishes.forEach(function (d) {
        var k = c.id + "|" + d.name;
        if (cart[k]) items.push({ name: d.name, qty: cart[k], cuisine: c.name });
      });
    });
    var d = new Date();
    var p2 = function (n) { return String(n).padStart(2, "0"); };
    return {
      items: items,
      count: items.reduce(function (a, x) { return a + x.qty; }, 0),
      stamp: d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " +
             p2(d.getHours()) + ":" + p2(d.getMinutes()),
      file: d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" +
            p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()),
      no: "JM" + Date.now().toString().slice(-8)
    };
  }

  /** 把一条虚线画在 canvas 上 */
  function dashLine(g, x1, x2, y) {
    g.save();
    g.strokeStyle = "#d9d4c8";
    g.lineWidth = 2;
    g.setLineDash([7, 7]);
    g.beginPath();
    g.moveTo(x1, y);
    g.lineTo(x2, y);
    g.stroke();
    g.restore();
  }

  /** 画成锯齿纸边（顺带把纸外的部分留成透明） */
  function paperPath(g, w, h, tooth) {
    g.beginPath();
    g.moveTo(0, tooth);
    for (var x = 0; x < w; x += tooth * 2) {
      g.lineTo(Math.min(x + tooth, w), 0);
      g.lineTo(Math.min(x + tooth * 2, w), tooth);
    }
    g.lineTo(w, h - tooth);
    for (var x2 = w; x2 > 0; x2 -= tooth * 2) {
      g.lineTo(Math.max(x2 - tooth, 0), h);
      g.lineTo(Math.max(x2 - tooth * 2, 0), h - tooth);
    }
    g.closePath();
  }

  /** 生成小票 canvas —— 2 倍尺寸画，存出来的图清晰 */
  function drawReceipt(data) {
    var W = 680;
    var PADX = 52;
    var TOOTH = 11;
    var TOP = 40;                       // 纸内上边距
    var SANS = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
    var MONO = 'ui-monospace,Menlo,Consolas,"Courier New",monospace';

    var headH = 108;                    // 标题 + 时间单号
    var itemH = 42 * data.items.length;
    var footH = 150;
    var H = TOP + headH + 30 + itemH + 30 + 54 + footH + TOP;

    var cv = document.createElement("canvas");
    cv.width = W;
    cv.height = H;
    var g = cv.getContext("2d");

    // 纸
    g.fillStyle = "#fffdf6";
    paperPath(g, W, H, TOOTH);
    g.fill();

    // 纸上一道很淡的横纹，像热敏纸
    g.save();
    g.globalAlpha = 0.35;
    g.fillStyle = "#fbf7ea";
    for (var y = TOOTH + 5; y < H - TOOTH; y += 52) g.fillRect(0, y, W, 26);
    g.restore();

    g.textBaseline = "middle";
    var y = TOP + TOOTH;

    // 标题
    g.textAlign = "center";
    g.fillStyle = "#2f2a24";
    g.font = "600 36px " + SANS;
    g.fillText("基 米 餐 馆", W / 2, y + 22);
    y += 50;

    // 时间 + 单号
    g.font = "19px " + MONO;
    g.fillStyle = "#9a938a";
    g.fillText(data.stamp + "　单号 " + data.no, W / 2, y + 16);
    y += 44;

    // 分隔线
    dashLine(g, PADX, W - PADX, y);
    y += 30;

    // 菜品
    g.textAlign = "left";
    data.items.forEach(function (it) {
      g.font = "23px " + SANS;
      g.fillStyle = "#2f2a24";
      g.fillText(it.name, PADX, y + 12);

      g.textAlign = "right";
      g.font = "23px " + MONO;
      g.fillStyle = "#7d766c";
      g.fillText("×" + it.qty, W - PADX, y + 12);
      g.textAlign = "left";
      y += 42;
    });

    y += 4;
    dashLine(g, PADX, W - PADX, y);
    y += 30;

    // 合计样数
    g.font = "600 24px " + SANS;
    g.fillStyle = "#2f2a24";
    g.fillText("共 " + data.count + " 样菜", PADX, y + 12);
    y += 46;

    dashLine(g, PADX, W - PADX, y);
    y += 34;

    // 结尾
    g.textAlign = "center";
    g.font = "22px " + SANS;
    g.fillStyle = "#7d766c";
    g.fillText("🥢　谢谢惠顾", W / 2, y + 10);
    y += 40;
    g.font = "17px " + SANS;
    g.fillStyle = "#b3aca2";
    g.fillText("本单仅供娱乐，不产生任何实际交易", W / 2, y + 8);

    return cv;
  }

  function downloadCanvas(cv, filename) {
    var done = function (url, revoke) {
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (revoke) URL.revokeObjectURL(url);
        a.remove();
      }, 2000);
    };
    if (cv.toBlob) {
      cv.toBlob(function (blob) {
        if (!blob) { downloadCanvas(cv, "x"); return; }
        done(URL.createObjectURL(blob), true);
      }, "image/png");
    } else {
      done(cv.toDataURL("image/png"), false);
    }
  }

  function showReceipt() {
    if (!cartCount()) return;
    var data = receiptData();
    if (!data.items.length) return;

    var cv = drawReceipt(data);
    var dataUrl = cv.toDataURL("image/png");
    var fname = "基米餐馆小票-" + data.file + ".png";

    $("#modalHost").innerHTML =
      '<div class="modal" id="modal"><div class="modal-in" style="max-width:480px">' +
      '<h2>小票<span class="x"><button class="btn" id="modalClose">关闭</button></span></h2>' +
      '<div style="text-align:center;margin-bottom:14px">' +
        '<img id="r-img" alt="基米餐馆小票" src="' + dataUrl + '" ' +
        'style="max-width:100%;border-radius:8px;box-shadow:0 10px 30px rgba(20,40,65,.18)" />' +
      "</div>" +
      '<p style="font-size:12px;color:var(--dim2);text-align:center;margin:0 0 16px">' +
        "手机上也可以长按图片保存</p>" +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn primary" id="r-save" style="flex:1;min-width:130px">💾 保存图片</button>' +
        '<button class="btn" id="r-copy" style="flex:1;min-width:110px">复制文字</button>' +
        '<button class="btn ghost" id="r-ok" style="flex:0 0 84px">好的</button>' +
      "</div></div></div>";

    function close() { $("#modalHost").innerHTML = ""; }
    $("#modalClose").onclick = close;
    $("#r-ok").onclick = close;
    $("#modal").addEventListener("click", function (e) { if (e.target.id === "modal") close(); });

    $("#r-save").onclick = function () {
      try {
        downloadCanvas(cv, fname);
        toast("小票图片已保存：" + fname);
      } catch (e) {
        toast("保存失败，长按图片试试", false);
      }
    };

    $("#r-copy").onclick = function () {
      var txt = "【基米餐馆】" + data.stamp + "　单号 " + data.no + "\n" +
        data.items.map(function (x) { return x.name + " ×" + x.qty; }).join("\n") +
        "\n共 " + data.count + " 样菜\n（仅供娱乐，不产生任何实际交易）";
      var okFn = function () { toast("已复制成文字"); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(okFn, function () { toast("复制失败", false); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); okFn(); } catch (e) { toast("复制失败", false); }
        document.body.removeChild(ta);
      }
    };
  }

  // ---------- 事件 ----------
  document.addEventListener("click", function (e) {
    var step = e.target.closest(".step button");
    if (step) {
      var card = step.closest(".dish");
      var key = card.dataset.key;
      var n = cart[key] || 0;
      if (step.dataset.act === "plus") cart[key] = n + 1;
      else { if (n <= 1) delete cart[key]; else cart[key] = n - 1; }
      saveCart();
      card.outerHTML = dishCardByKey(key);
      renderCuisines();
      renderCart();
      return;
    }
    var cb = e.target.closest("#cuisines button");
    if (cb) {
      cur = cb.dataset.c;
      q = ""; $("#q").value = "";
      spicy = -1; $("#spicy").value = "-1";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  function dishCardByKey(key) {
    var found = null;
    allDishes().forEach(function (x) { if (x.key === key) found = x; });
    return found ? dishCard(found.c, found.d) : "";
  }

  $("#go").addEventListener("click", unlock);
  $("#pwd").addEventListener("keydown", function (e) { if (e.key === "Enter") unlock(); });

  var qTimer = null;
  $("#q").addEventListener("input", function (e) {
    clearTimeout(qTimer);
    var v = e.target.value;
    qTimer = setTimeout(function () { q = v; renderDishes(); }, 140);
  });
  $("#spicy").addEventListener("change", function (e) { spicy = Number(e.target.value); renderDishes(); });

  $("#lucky").addEventListener("click", function () {
    var pool = [];
    (MENU ? MENU.cuisines : []).forEach(function (c) {
      c.dishes.forEach(function (d) { pool.push({ c: c, d: d, key: c.id + "|" + d.name }); });
    });
    if (!pool.length) return;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    cart[pick.key] = (cart[pick.key] || 0) + 1;
    saveCart();
    cur = pick.c.id; q = ""; $("#q").value = ""; spicy = -1; $("#spicy").value = "-1";
    render();
    var el = document.querySelector('.dish[data-key="' + CSS.escape(pick.key) + '"]');
    if (el) {
      el.scrollIntoView({ block: "center", behavior: "smooth" });
      el.style.transition = "box-shadow .3s";
      el.style.boxShadow = "0 0 0 4px rgba(226,112,10,.35), 0 12px 26px rgba(20,40,65,.1)";
      setTimeout(function () { el.style.boxShadow = ""; }, 1400);
    }
    toast("给你点了：" + pick.d.name);
  });

  $("#c-clear").addEventListener("click", function () {
    if (!cartCount()) return;
    if (!confirm("清空已点的 " + cartCount() + " 样？")) return;
    cart = {}; saveCart(); render();
  });
  $("#c-order").addEventListener("click", showReceipt);
  $("#s-lock").addEventListener("click", function () {
    if (!confirm("退出餐馆？下次要重新输密码。")) return;
    cart = {}; saveCart(); lockOut("");
    toast("已退出");
  });

  var toTop = $("#toTop");
  function onScroll() { toTop.classList.toggle("on", window.scrollY > 620); }
  window.addEventListener("scroll", onScroll, { passive: true });
  toTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  onScroll();

  // ---------- 启动 ----------
  loadCart();
  if (window.SITE) {
    $("#foot-note").textContent = "菜单只在服务器上，没密码看不到。";
    $("#foot-copy").textContent = "© 2026 哈基米";
  }
  if (MIRROR) {
    $("#gate").innerHTML =
      '<div class="lock">🍚</div><h2>基米餐馆</h2>' +
      '<p style="line-height:2">这是<b>备份镜像站</b>，没有后端<br>' +
      "餐馆要密码才能进，只能在主站用<br><br>" +
      '<a class="btn primary" href="http://119.45.171.242:8080/jimi-restaurant/" ' +
      'style="display:inline-block;padding:12px 24px;text-decoration:none">去主站 →</a></p>';
    return;
  }
  if (!token) {
    showGate("");
  } else {
    setStat("#s-api", "连接中…");
    fetchMenu().then(function (ok) {
      if (!ok) return;
      $("#gate").hidden = true;
      $("#app").hidden = false;
      cur = MENU.cuisines[0].id;
      render();
    })["catch"](function () {});
  }
})();
</script>
</body>
</html>
