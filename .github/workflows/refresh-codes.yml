name: 刷新改枪码数据

# 手动触发：仓库页 Actions → 刷新改枪码数据 → Run workflow
# 想定时跑就取消下面 schedule 的注释。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 1 * * *'   # 每天 09:00 (北京时间)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取腾讯文档
        run: python scripts/fetch_codes.py --out data/codes.json

      - name: 生成站点数据
        run: python scripts/build_site.py

      - name: 有变化就提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/codes.json docs/data.js
          if git diff --staged --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: 刷新改枪码数据"
            git push
          fi
